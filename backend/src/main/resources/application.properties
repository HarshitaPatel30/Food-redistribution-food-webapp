# ============================================================
# Food Redistribution Platform - Application Configuration
# ============================================================
# Use environment variables for sensitive configuration.
# See .env.example for required variables.
# ============================================================

# DATABASE (use environment variables - never hardcode credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_redistribution}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8085}

# Logging
logging.level.com.foodredistribution=INFO
logging.level.org.springframework.web=WARN

# Frontend origin (for CORS)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Jackson: serialize LocalDateTime as ISO string
spring.jackson.serialization.write-dates-as-timestamps=false
